name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-winget:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the complete winget manifest set
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = (Get-ChildItem winget/android-compat-scout -Directory | Sort-Object { [version]$_.Name } | Select-Object -Last 1).Name
          }
          $manifest = "winget/android-compat-scout/$version"
          if (!(Test-Path $manifest)) { throw "Missing winget manifests for $version" }
          winget validate --manifest $manifest

  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: compat-scout-x86_64-unknown-linux-musl.tar.gz
            builder: cargo
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: compat-scout-aarch64-unknown-linux-musl.tar.gz
            builder: cross
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: compat-scout-aarch64-apple-darwin.tar.gz
            builder: cargo
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: compat-scout-x86_64-apple-darwin.tar.gz
            builder: cargo
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: compat-scout-x86_64-pc-windows-msvc.zip
            builder: cargo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
        if: matrix.builder == 'cross'
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.builder }}" = cross ]; then
            cross build --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/compat-scout" release/compat-scout
          tar -czf "release/${{ matrix.asset }}" -C release compat-scout
      - name: Package Linux deb and rpm
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          cargo build --release
          cargo install cargo-deb --locked
          cargo deb --no-build
          cp target/debian/*.deb release/android-compat-scout_${GITHUB_REF_NAME#v}_amd64.deb
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz | tar -xz nfpm
          ./nfpm package --config packaging/nfpm.yaml --packager rpm --target "release/android-compat-scout-${GITHUB_REF_NAME#v}-1.x86_64.rpm"
      - name: Package macOS pkg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p pkgroot/usr/local/bin
          cp "target/${{ matrix.target }}/release/compat-scout" pkgroot/usr/local/bin/
          pkgbuild --root pkgroot --identifier in.sociobot.android-compat-scout --version "${GITHUB_REF_NAME#v}" "release/android-compat-scout-${{ matrix.target }}.pkg"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/compat-scout.exe" release/compat-scout.exe
          Compress-Archive -Path release/compat-scout.exe -DestinationPath "release/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Create checksums, consumer manifests, and latest metadata
        shell: bash
        run: |
          mkdir release
          find downloaded -type f -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          node -e 'const fs=require("fs"); const base=process.argv[1], version=process.argv[2]; const names=fs.readdirSync(".").filter(n=>n.startsWith("compat-scout-") && /\.(tar\.gz|zip)$/.test(n)); const assets=Object.fromEntries(names.map(n=>[n.replace("compat-scout-","").replace(".tar.gz","").replace(".zip","").replace(/-/g,"_"), `${base}/${n}`])); fs.writeFileSync("latest.json", JSON.stringify({version,assets},null,2)+"\n")' "$base" "$version"
          linux_hash="$(awk '/compat-scout-x86_64-pc-windows-msvc.zip/{print $1}' SHA256SUMS)"
          cat > android-compat-scout.json <<EOF
          {"version":"$version","description":"Private Android compatibility snapshot and regression report","homepage":"https://android-compat-scout.sociobot.in","license":"MIT","architecture":{"64bit":{"url":"$base/compat-scout-x86_64-pc-windows-msvc.zip","bin":"compat-scout.exe","hash":"$linux_hash"}}}
          EOF
          cat > android-compat-scout.rb <<EOF
          class AndroidCompatScout < Formula
            desc "Private Android compatibility snapshots and regression reports"
            homepage "https://android-compat-scout.sociobot.in"
            on_macos do
              on_arm do
                url "$base/compat-scout-aarch64-apple-darwin.tar.gz"
                sha256 "$(awk '/compat-scout-aarch64-apple-darwin.tar.gz/{print $1}' SHA256SUMS)"
              end
              on_intel do
                url "$base/compat-scout-x86_64-apple-darwin.tar.gz"
                sha256 "$(awk '/compat-scout-x86_64-apple-darwin.tar.gz/{print $1}' SHA256SUMS)"
              end
            end
            def install; bin.install "compat-scout"; end
          end
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
